# Development CDN only. Drasl has a separate disposable lab configuration.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}"
    environment:
      # Container networking, not a public host bind. Publication stays loopback.
      API_HOST: "0.0.0.0"
      API_PORT: "${API_PORT:-8000}"
      WORKERS_NUM: "${WORKERS_NUM:-1}"
      API_REQUESTS_PER_SECOND: "${API_REQUESTS_PER_SECOND:-128}"
      CLIENT_REPORTS_PRUNE_INTERVAL_SECONDS: "${CLIENT_REPORTS_PRUNE_INTERVAL_SECONDS:-3600}"
      OMK_API_CPUS: "${OMK_API_CPUS:-1.0}"
      OMK_API_MEMORY_MIB: "${OMK_API_MEMORY_MIB:-1024}"
      OMK_API_LOG_MIB: "${OMK_API_LOG_MIB:-10}"
      OMK_API_LOG_FILES: "${OMK_API_LOG_FILES:-3}"
      CONTENT_ROOT: /data/content
    cpus: "${OMK_API_CPUS:-1.0}"
    mem_limit: "${OMK_API_MEMORY_MIB:-1024}m"
    logging:
      driver: local
      options:
        max-size: "${OMK_API_LOG_MIB:-10}m"
        max-file: "${OMK_API_LOG_FILES:-3}"
    volumes:
      - type: bind
        source: ${OMK_API_CONTENT_SOURCE:-./data/content}
        target: /data/content
        read_only: true
        bind:
          create_host_path: false
