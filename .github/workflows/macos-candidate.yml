name: macOS launcher packaging

on:
  push:
    branches: [codex/dj2-macos]

permissions:
  contents: read

jobs:
  launcher:
    runs-on: macos-15
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 2151cfc82a38da7e52b999e7939203c2d7c6bee5
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.12"
      - name: Verify stable source, Apple Silicon and the production update root
        run: |
          test "$(git rev-parse HEAD)" = 2151cfc82a38da7e52b999e7939203c2d7c6bee5
          test "$(uname -m)" = arm64
          curl --fail --silent --show-error --location --retry 2 --proto '=https' https://138.124.40.35/updates/metadata/1.root.json --output macos-update-root.json
          printf '%s  %s\n' ca7bc1f1ab8d25a63822c3bb19b20eebcc5a36cd8775b8ce377e1a2ca6623a9c macos-update-root.json | shasum -a 256 -c
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync python scripts/build_launcher.py --output macos-release --root-metadata macos-update-root.json --auth-url https://138.124.40.35 --api-url https://138.124.40.35 --minimum-pack-generations '{"dj2":1}'
      - run: uv run --no-sync python scripts/release_materials.py --archive macos-release
      - name: Verify native architecture and start the portable launcher
        run: |
          test "$(lipo -archs macos-release/OmkalityCraft/OmkalityCraft)" = arm64
          uv run --no-sync python scripts/smoke_bundle.py --bundle macos-release/OmkalityCraft
      - run: uv run --no-sync python scripts/smoke_bundle.py --prepare
      - run: uv run --no-sync python scripts/smoke_bundle.py --archive macos-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OmkalityCraft-0.3.5-macos-arm64
          path: |
            macos-release/*.zip
            macos-release/*.zip.sha256
            macos-release/*.release.json
          if-no-files-found: error
          retention-days: 14
