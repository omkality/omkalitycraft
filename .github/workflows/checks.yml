name: Development checks

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner_tui:
    name: Owner TUI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.12"
      - run: uv sync --locked --no-default-groups --group shared --group dev
      - run: rustup toolchain install 1.93.1 --profile minimal --component clippy --component rustfmt
      - run: uv run --no-sync python scripts/check_owner_tui.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-tui-${{ matrix.os }}
          path: |
            tui/target/release/omk-tui
            tui/target/release/omk-tui.exe
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.12"
      - run: uv sync --locked --no-default-groups --group shared --group api --group dev
      - run: uv run --no-sync ruff check api omk launcher scripts tests mods
      - run: uv run --no-sync ruff format --check api omk launcher scripts tests mods
      - run: uv run --locked --no-sync python -m mypy api/settings/config.py api/__main__.py launcher/session.py launcher/files.py launcher/releases.py launcher/install.py
      - run: uv run --no-sync pytest tests/unit -q -n 4 --dist=loadfile
      - name: Standard monitoring configuration and real PromQL rules
        run: uv run --no-sync python -m scripts.check_monitoring
      - name: Disposable Linux backup filesystem faults
        run: |
          docker pull python:3.14.2-slim@sha256:1a3c6dbfd2173971abba880c3cc2ec4643690901f6ad6742d0827bae6cefc925
          uv run --no-sync python -m omk lab backup-safety
      - name: Disposable API image and runtime configuration
        id: api_smoke
        run: uv run --no-sync python scripts/smoke_api_container.py
      - name: Diagnose failed API shutdown without hiding the original failure
        if: ${{ failure() && steps.api_smoke.outcome == 'failure' }}
        run: uv run --no-sync python scripts/diagnose_api_shutdown.py --cycles 12
      - name: Granian shutdown race regression in an isolated fixture
        run: uv run --no-sync python scripts/diagnose_api_shutdown.py --race --cycles 3

  api_integration:
    name: Compose API integration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.12"
      - run: uv sync --locked --no-default-groups --group shared --group api --group dev --group integration
      - run: uv run --no-sync pytest tests/integration -q -n 0 --junitxml=integration.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: api-integration-junit
          path: integration.xml

  desktop:
    name: Desktop UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.12"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked --all-groups
      - name: Unit tests across four workers
        run: uv run --no-sync pytest tests/unit -q -n 4 --dist=loadfile
      - name: Qt UI tests in one process
        run: uv run --no-sync pytest tests/ui -v -n 0
      - name: Launcher widget lifetime under cyclic GC
        env:
          OMK_TEST_QT_GC_STRESS: "1"
        run: uv run --no-sync pytest --keep-duplicates tests/ui tests/ui tests/ui -v -n 0
      - if: runner.os == 'Linux'
        run: docker compose -f deploy/auth-lab/compose.yaml build --pull
      - if: runner.os == 'Linux'
        run: uv run --no-sync omk lab launcher smoke

  forge_mods:
    name: Forge mods source boundary and reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/check_mod_sources.py
      - run: python3 scripts/check_forge_mods.py

  drasl:
    name: Real Drasl authentication protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.12"
      - run: uv sync --locked --no-default-groups --group shared --group api
      - run: docker compose -f deploy/auth-lab/compose.yaml build --pull
      - run: uv run --no-sync omk lab auth smoke
      - run: uv run --no-sync omk lab auth expiry
      - run: docker pull python:3.14.2-slim@sha256:1a3c6dbfd2173971abba880c3cc2ec4643690901f6ad6742d0827bae6cefc925
      - name: Persistent Drasl restart and isolated backup restore
        run: uv run --no-sync omk lab auth-storage
      - name: Cold backup owner CLI on isolated Linux volumes
        run: uv run --no-sync omk lab cold-backups
      - run: uv run --no-sync omk lab admin smoke

  portable:
    name: Portable startup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'macos-15' && 'cocoa' || 'offscreen' }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.12"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync python scripts/smoke_bundle.py --prepare
      - run: uv run --no-sync python scripts/build_launcher.py --output .local/portable-ci --root-metadata .local/packaging-fixture/repository/metadata/1.root.json --auth-url http://127.0.0.1:9 --api-url http://127.0.0.1:9
      - run: uv run --no-sync python scripts/release_materials.py --archive .local/portable-ci
      - if: runner.os == 'macOS'
        run: uv run --no-sync python scripts/smoke_bundle.py --finder-archive .local/portable-ci
      - run: uv run --no-sync python scripts/smoke_bundle.py --archive .local/portable-ci
