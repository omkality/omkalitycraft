name: Full DJ2 crash check on macOS

on:
  push:
    branches: [codex/verify-macos-037]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: cocoa
      OMK_TEST_MAC_SOFTWARE_GL: "1"
      OMK_TEST_MAC_DIRECT_MENU: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 5
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca
        with:
          version: "0.11.12"
      - run: |
          test "$(uname -m)" = arm64
          source=389d7442232254b99adf49f9106051298e6d58de
          git merge-base --is-ancestor "$source" HEAD
          test -z "$(git diff --name-only "$source" HEAD -- launcher omk pyproject.toml uv.lock)"
          uv sync --locked --all-groups
          uv run --no-sync python .github/ci/launcher-crash-037/run_macos.py
