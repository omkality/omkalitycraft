[project]
name = "omkalitycraft-api"
version = "0.3.0.dev2"
description = "OmkalityCraft CDN and development tools; Drasl authentication"
readme = "README.md"
requires-python = "==3.14.2"
dependencies = []

[project.scripts]
omk = "omk.cli:main"

[dependency-groups]
shared = [
    "cryptography>=46.0.0",
    "packaging>=25.0",
    "pillow>=12.0.0",
    "psutil>=7.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "tuf>=6.0.0",
]
api = [
    "granian>=2.7.0",
    "litestar>=2.19.0",
]
launcher = [
    "pyside6>=6.10.0",
]
dev = [
    "black>=26.1.0",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

gui-test = ["pytest-qt>=4.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "omk", "launcher"]
