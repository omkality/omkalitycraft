services:
  drasl:
    extends:
      file: service.yaml
      service: drasl
    ports:
      - "127.0.0.1:${OMK_AUTH_HTTP_PORT:-25586}:${OMK_AUTH_INTERNAL_PORT:-25585}"
    volumes:
      - type: bind
        source: ${OMK_AUTH_CONFIG:?Set OMK_AUTH_CONFIG to an absolute private Drasl TOML path}
        target: /etc/drasl/config.toml
        read_only: true
volumes:
  drasl-state:
    labels:
      omkality.role: auth-state
