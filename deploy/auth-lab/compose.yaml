services:
  drasl:
    extends:
      file: ../auth/service.yaml
      service: drasl
    ports:
      - "127.0.0.1:25586:25585"
    volumes:
      - type: bind
        source: ${OMK_AUTH_LAB_CONFIG:-./config.toml}
        target: /etc/drasl/config.toml
        read_only: true
    # Fresh Compose project per lab; only that project's volume is disposable.
volumes:
  drasl-state:
    labels:
      omkality.role: auth-state
