services:
  drasl:
    # Pinned upstream + the reviewed atomic single-use invitation fix.
    image: omkalitycraft-drasl:4.0.0-omk.1
    pull_policy: never
    build:
      context: ../drasl
    ports:
      - "127.0.0.1:25586:25585"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - type: bind
        source: ${OMK_AUTH_LAB_CONFIG:-./config.toml}
        target: /etc/drasl/config.toml
        read_only: true
      - type: bind
        source: ../../launcher/assets/skins/default-slim.png
        target: /var/lib/drasl/default-skin/default-slim.png
        read_only: true
    # Disposable accounts only. No production database or existing game directory.
    tmpfs:
      - /var/lib/drasl:mode=1777
