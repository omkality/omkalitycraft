# Loopback CDN API. Authentication and game services are separate stacks.
name: omkalitycraft-api
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/api/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}"
    environment:
      # Container networking, not a public host bind. Publication stays loopback.
      API_HOST: "0.0.0.0"
      API_PORT: "${API_PORT:-8000}"
      WORKERS_NUM: "${WORKERS_NUM:-1}"
      API_REQUESTS_PER_SECOND: "${API_REQUESTS_PER_SECOND:-128}"
      CLIENT_REPORTS_PRUNE_INTERVAL_SECONDS: "${CLIENT_REPORTS_PRUNE_INTERVAL_SECONDS:-3600}"
      OMK_API_CPUS: "${OMK_API_CPUS:-1.0}"
      OMK_API_MEMORY_MIB: "${OMK_API_MEMORY_MIB:-1024}"
      OMK_API_LOG_MIB: "${OMK_API_LOG_MIB:-10}"
      OMK_API_LOG_FILES: "${OMK_API_LOG_FILES:-3}"
      SERVER_STATUS_TARGETS: "${SERVER_STATUS_TARGETS:-}"
      SERVER_STATUS_CACHE_SECONDS: "${SERVER_STATUS_CACHE_SECONDS:-15}"
      SERVER_STATUS_TIMEOUT_SECONDS: "${SERVER_STATUS_TIMEOUT_SECONDS:-2}"
      CONTENT_ROOT: /data/content
    cpus: "${OMK_API_CPUS:-1.0}"
    mem_limit: "${OMK_API_MEMORY_MIB:-1024}m"
    # Required by Granian's Linux multi-worker socket sharing. This changes only
    # the container network namespace, never the host's global sysctl.
    sysctls:
      net.ipv4.tcp_migrate_req: "1"
    logging:
      driver: local
      options:
        max-size: "${OMK_API_LOG_MIB:-10}m"
        max-file: "${OMK_API_LOG_FILES:-3}"
    volumes:
      - type: bind
        source: ${OMK_API_CONTENT_SOURCE:?Set the existing host CDN content directory}
        target: /data/content
        read_only: true
        bind:
          create_host_path: false
