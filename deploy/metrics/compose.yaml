# Opt-in, private Linux collector. No ports, Docker socket, host PID mode or network.
services:
  metrics:
    build:
      context: ../..
      dockerfile: deploy/metrics/Dockerfile
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: ${OMK_METRICS_RESTART:-unless-stopped}
    cpus: "${OMK_METRICS_CPUS:-0.25}"
    mem_limit: "${OMK_METRICS_MEMORY_MIB:-96}m"
    pids_limit: ${OMK_METRICS_PIDS:-32}
    stop_grace_period: ${OMK_METRICS_STOP_SECONDS:-10}s
    healthcheck:
      test: [CMD, python, -m, omk.resource_history, health]
      interval: ${OMK_METRICS_HEALTH_SECONDS:-30}s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      OMK_METRICS_INTERVAL_SECONDS: "${OMK_METRICS_INTERVAL_SECONDS:-30}"
      OMK_METRICS_DATABASE_MIB: "${OMK_METRICS_DATABASE_MIB:-64}"
      OMK_METRICS_DETAIL_DAYS: "${OMK_METRICS_DETAIL_DAYS:-7}"
      OMK_METRICS_HOURLY_DAYS: "${OMK_METRICS_HOURLY_DAYS:-180}"
      OMK_METRICS_RESERVE_MIB: "${OMK_METRICS_RESERVE_MIB:-24576}"
    logging:
      driver: local
      options:
        max-size: "${OMK_METRICS_LOG_MIB:-1}m"
        max-file: "${OMK_METRICS_LOG_FILES:-2}"
    volumes:
      - history:/history
      - type: bind
        source: ${OMK_METRICS_CONFIG:?Use a private metrics configuration}
        target: /run/metrics/config.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMK_METRICS_PROJECT:?Use the project filesystem on the Linux host}
        target: /storage/project
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMK_METRICS_HOST_CGROUP:-/sys/fs/cgroup}
        target: /cgroups
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMK_METRICS_HOST_PROC:-/proc}/stat
        target: /host/stat
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMK_METRICS_HOST_PROC:-/proc}/meminfo
        target: /host/meminfo
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMK_METRICS_HOST_PROC:-/proc}/vmstat
        target: /host/vmstat
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMK_METRICS_HOST_PROC:-/proc}/diskstats
        target: /host/diskstats
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMK_METRICS_HOST_PROC:-/proc}/1/net/dev
        target: /host/netdev
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMK_METRICS_HOST_PROC:-/proc}/sys/kernel/random/boot_id
        target: /host/boot_id
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMK_METRICS_HOST_PROC:-/proc}/pressure/cpu
        target: /host/pressure-cpu
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMK_METRICS_HOST_PROC:-/proc}/pressure/memory
        target: /host/pressure-memory
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OMK_METRICS_HOST_PROC:-/proc}/pressure/io
        target: /host/pressure-io
        read_only: true
        bind: {create_host_path: false}
volumes:
  history:
