[package]
name = "omk-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Owner terminal for OmkalityCraft Python services"

[dependencies]
ratatui = "=0.30.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tempfile = "=3.25.0"

[target.'cfg(not(windows))'.dependencies]
crossterm = { version = "=0.29.0", features = ["osc52"], default-features = false }

[build-dependencies]
embed-resource = "=3.0.12"

[lints.clippy]
all = "warn"
